<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>relay</title></head><body><p id="s">loading</p><script>
const p=new URLSearchParams(location.search),f=p.get('f')||'';
if(/^[a-z0-9-]+\.csv$/.test(f)){fetch('https://raw.githubusercontent.com/digitalworldslab/digitalworlds-site/etsy-assets/pins-2811/'+f,{cache:'no-store'}).then(r=>r.text()).then(t=>{if(window.opener){window.opener.postMessage({csvname:f,text:t},'https://pl.pinterest.com');document.getElementById('s').textContent='sent '+t.length;}else document.getElementById('s').textContent='no opener';});}
</script></body></html>
